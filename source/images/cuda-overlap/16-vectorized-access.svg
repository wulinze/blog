<rect x="313" y="582" width="54" height="44" rx="5" fill="#dff3e5" stroke="#243247" stroke-width="1.5"/>
<text x="330" y="611" font-size="21" fill="#243247">4</text>
<rect x="367" y="582" width="54" height="44" rx="5" fill="#dff3e5" stroke="#243247" stroke-width="1.5"/>
<text x="384" y="611" font-size="21" fill="#243247">5</text>
<rect x="421" y="582" width="54" height="44" rx="5" fill="#dff3e5" stroke="#243247" stroke-width="1.5"/>
<text x="438" y="611" font-size="21" fill="#243247">6</text>
<rect x="475" y="582" width="54" height="44" rx="5" fill="#dff3e5" stroke="#243247" stroke-width="1.5"/>
<text x="492" y="611" font-size="21" fill="#243247">7</text>
<text x="343" y="664" font-size="20" fill="#243247">in4[1] · 16 byte</text>
