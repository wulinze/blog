<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1030" viewBox="0 0 1100 1030" role="img"><g font-family="Xiaolai, 'PingFang SC', 'Microsoft YaHei', sans-serif"><title>6.3 · 向量化：把单个线程的一次访问从 4 byte 加宽到 16 byte</title>
<rect x="0" y="0" width="1100" height="1030" rx="5" fill="#fffdf6" stroke="#fffdf6" stroke-width="1.5"/>
<text x="34" y="56" font-size="30" fill="#243247">6.3 · 向量化：把单个线程的一次访问从 4 byte 加宽到 16 byte</text>
<text x="34" y="100" font-size="22" fill="#667286">取第一轮的线程 t0–t3 作示意；格子是 float，下标表示同一数组中的位置。</text>
<text x="34" y="135" font-size="21" fill="#667286">箭头表示本线程读取的范围。这里只画 load；copy 的 store 使用相同映射。</text>
<rect x="28" y="165" width="1044" height="228" rx="5" fill="#f0f0ed" stroke="#243247" stroke-width="1.5"/>
<text x="48" y="205" font-size="24" fill="#243247">① scalar：每个线程这次读 1 个 float，仍然可以合并访存</text>
<rect x="123" y="233" width="100" height="38" rx="5" fill="#dcecff" stroke="#243247" stroke-width="1.5"/>
<text x="158" y="259" font-size="21" fill="#243247">t0</text>
<path d="M 173 279 L 173 312" stroke="#243247" stroke-width="2" fill="none"/>
<path d="M 169.08531019299892 303.8959760788259 L 173 312 L 176.91468980700108 303.8959760788259" stroke="#243247" stroke-width="2" fill="none"/>
<rect x="123" y="322" width="100" height="44" rx="5" fill="#dff3e5" stroke="#243247" stroke-width="1.5"/>
<text x="144" y="350" font-size="20" fill="#243247">in[0]</text>
<rect x="371" y="233" width="100" height="38" rx="5" fill="#dcecff" stroke="#243247" stroke-width="1.5"/>
<text x="406" y="259" font-size="21" fill="#243247">t1</text>
<path d="M 421 279 L 421 312" stroke="#243247" stroke-width="2" fill="none"/>
<path d="M 417.0853101929989 303.8959760788259 L 421 312 L 424.9146898070011 303.8959760788259" stroke="#243247" stroke-width="2" fill="none"/>
<rect x="371" y="322" width="100" height="44" rx="5" fill="#dff3e5" stroke="#243247" stroke-width="1.5"/>
<text x="392" y="350" font-size="20" fill="#243247">in[1]</text>
<rect x="619" y="233" width="100" height="38" rx="5" fill="#dcecff" stroke="#243247" stroke-width="1.5"/>
<text x="654" y="259" font-size="21" fill="#243247">t2</text>
<path d="M 669 279 L 669 312" stroke="#243247" stroke-width="2" fill="none"/>
<path d="M 665.0853101929989 303.8959760788259 L 669 312 L 672.9146898070011 303.8959760788259" stroke="#243247" stroke-width="2" fill="none"/>
<rect x="619" y="322" width="100" height="44" rx="5" fill="#dff3e5" stroke="#243247" stroke-width="1.5"/>
<text x="640" y="350" font-size="20" fill="#243247">in[2]</text>
<rect x="867" y="233" width="100" height="38" rx="5" fill="#dcecff" stroke="#243247" stroke-width="1.5"/>
<text x="902" y="259" font-size="21" fill="#243247">t3</text>
<path d="M 917 279 L 917 312" stroke="#243247" stroke-width="2" fill="none"/>
<path d="M 913.0853101929989 303.8959760788259 L 917 312 L 920.9146898070011 303.8959760788259" stroke="#243247" stroke-width="2" fill="none"/>
<rect x="867" y="322" width="100" height="44" rx="5" fill="#dff3e5" stroke="#243247" stroke-width="1.5"/>
<text x="888" y="350" font-size="20" fill="#243247">in[3]</text>
<rect x="28" y="424" width="1044" height="264" rx="5" fill="#f0f0ed" stroke="#243247" stroke-width="1.5"/>
<text x="48" y="464" font-size="24" fill="#243247">② float4：每个线程这次读 4 个连续 float，线程间也仍是连续范围</text>
<rect x="123" y="493" width="100" height="38" rx="5" fill="#dcecff" stroke="#243247" stroke-width="1.5"/>
<text x="158" y="519" font-size="21" fill="#243247">t0</text>
<path d="M 173 539 L 173 572" stroke="#243247" stroke-width="2" fill="none"/>
<path d="M 169.08531019299892 563.8959760788259 L 173 572 L 176.91468980700108 563.8959760788259" stroke="#243247" stroke-width="2" fill="none"/>
