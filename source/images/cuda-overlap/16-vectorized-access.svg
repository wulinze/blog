<text x="654" y="519" font-size="21" fill="#243247">t2</text>
<path d="M 669 539 L 669 572" stroke="#243247" stroke-width="2" fill="none"/>
<path d="M 665.0853101929989 563.8959760788259 L 669 572 L 672.9146898070011 563.8959760788259" stroke="#243247" stroke-width="2" fill="none"/>
<rect x="561" y="582" width="54" height="44" rx="5" fill="#ffe4bf" stroke="#243247" stroke-width="1.5"/>
<text x="578" y="611" font-size="21" fill="#243247">8</text>
<rect x="615" y="582" width="54" height="44" rx="5" fill="#ffe4bf" stroke="#243247" stroke-width="1.5"/>
<text x="632" y="611" font-size="21" fill="#243247">9</text>
<rect x="669" y="582" width="54" height="44" rx="5" fill="#ffe4bf" stroke="#243247" stroke-width="1.5"/>
<text x="686" y="611" font-size="21" fill="#243247">10</text>
<rect x="723" y="582" width="54" height="44" rx="5" fill="#ffe4bf" stroke="#243247" stroke-width="1.5"/>
<text x="740" y="611" font-size="21" fill="#243247">11</text>
<text x="591" y="664" font-size="20" fill="#243247">in4[2] · 16 byte</text>
<rect x="867" y="493" width="100" height="38" rx="5" fill="#eee3fb" stroke="#243247" stroke-width="1.5"/>
<text x="902" y="519" font-size="21" fill="#243247">t3</text>
<path d="M 917 539 L 917 572" stroke="#243247" stroke-width="2" fill="none"/>
<path d="M 913.0853101929989 563.8959760788259 L 917 572 L 920.9146898070011 563.8959760788259" stroke="#243247" stroke-width="2" fill="none"/>
<rect x="809" y="582" width="54" height="44" rx="5" fill="#eee3fb" stroke="#243247" stroke-width="1.5"/>
<text x="826" y="611" font-size="21" fill="#243247">12</text>
<rect x="863" y="582" width="54" height="44" rx="5" fill="#eee3fb" stroke="#243247" stroke-width="1.5"/>
<text x="880" y="611" font-size="21" fill="#243247">13</text>
<rect x="917" y="582" width="54" height="44" rx="5" fill="#eee3fb" stroke="#243247" stroke-width="1.5"/>
<text x="934" y="611" font-size="21" fill="#243247">14</text>
<rect x="971" y="582" width="54" height="44" rx="5" fill="#eee3fb" stroke="#243247" stroke-width="1.5"/>
<text x="988" y="611" font-size="21" fill="#243247">15</text>
<text x="839" y="664" font-size="20" fill="#243247">in4[3] · 16 byte</text>
<rect x="28" y="722" width="1044" height="140" rx="5" fill="#dcecff" stroke="#243247" stroke-width="1.5"/>
<text x="48" y="762" font-size="25" fill="#243247">固定工作量看收益：同样复制 16 个 float = 64 byte</text>
<text x="48" y="802" font-size="23" fill="#243247">标量：16 次线程级元素读取；float4：4 次线程级向量读取。</text>
<text x="48" y="840" font-size="21" fill="#243247">这是线程级计数，不是 warp 指令数，也不是 HBM 事务数；总数据量不变。</text>
<text x="34" y="907" font-size="22" fill="#243247">对照代码：in4[t] 覆盖 in[4*t] 到 in[4*t+3]，并非每次跳过 3 个元素。</text>
<text x="34" y="951" font-size="22" fill="#243247">条件：16-byte 对齐、尾部单独处理，且编译器确实生成宽 load/store。</text>
<text x="34" y="994" font-size="21" fill="#667286">优化目标是减少访存指令与循环开销；实际指令宽度看 SASS，收益靠实测。</text></g></svg>
