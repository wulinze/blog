# 站点基础信息；主题外观在 _config.next.yml 中维护。
title: Wu's Blog
subtitle: 技术分享 · 思考与实践
description: wulinze 的个人主页，关注 LLM 并行方式、Cache 池化与算子学习，分享系统知识和 LeetCode 刷题记录。
author: wulinze
language: zh-CN
timezone: Asia/Shanghai
url: https://wulinze.github.io
root: /
permalink: :year/:month/:day/:title/
pretty_urls:
  trailing_index: false
  trailing_html: true
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
new_post_name: :title.md
default_layout: post
post_asset_folder: false
relative_link: false
render_drafts: false
future: false
external_link:
  enable: true
  field: site
  exclude: []
syntax_highlighter: highlight.js
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: '  '
  wrap: true
  hljs: false
index_generator:
  path: blog
  per_page: 10
  order_by: -date
default_category: 技术笔记
category_map:
  LeetCode 刷题: leetcode
  系统知识: systems
  LLM 推理: llm-inference
  数学与计算: mathematics
tag_map:
  C++: cpp
  JVM: jvm
per_page: 10
pagination_dir: page
date_format: YYYY-MM-DD
time_format: HH:mm
updated_option: date
meta_generator: true
include:
  - .nojekyll
exclude: []
ignore: []
markdown:
  preset: default
  render:
    html: true
    breaks: false
    linkify: true
    typographer: false
  anchors:
    level: 2
    permalink: false
    separator: '-'
search:
  path: search.xml
  field: post
  content: true
  format: html
feed:
  type: atom
  path: atom.xml
  limit: 20
  content: false
sitemap:
  path: sitemap.xml
theme: next
# 发布逻辑在 tools/publish.mjs；npm run deploy 会先验证构建。
